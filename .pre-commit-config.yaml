repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
  - repo: local
    hooks:
      - id: build
        name: build
        entry: cargo build --verbose
        language: rust
        pass_filenames: false
      - id: fmt
        name: fmt
        entry: cargo fmt --all -- --check
        language: rust
        pass_filenames: false
      - id: test
        name: test
        entry: cargo test
        language: rust
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy
        language: rust
        pass_filenames: false
